name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP_SHA256: 129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # Guarantees an 8.0 runtime for the net8.0 fixtures (FixtureLib and FixtureGame).
      # `dotnet build` uses the newest SDK installed, which may be newer than 8.0.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_ZIP_SHA256 }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${zip}"
          echo "${GODOT_ZIP_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p ~/godot
          unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot

      # The binary needs the GodotSharp directory beside it, so link it rather than copy it.
      - name: Put godot-mono on PATH
        run: |
          set -euo pipefail
          dir="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          chmod +x "$dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          mkdir -p "$HOME/bin"
          ln -sf "$dir/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" "$HOME/bin/godot-mono"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          godot-mono --version
          dotnet --version
          bun --version
          timeout --version | head -1

      - run: bun run check
